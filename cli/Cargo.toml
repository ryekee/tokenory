[workspace]
resolver = "2"
members = [
    "tokens-core",
    "tokenory",
]

[workspace.package]
version = "27.1.1"
edition = "2021"
authors = ["Junho Yeo <hello@junho.io>"]
license = "MIT"
repository = "https://github.com/missuo/tokens"

[workspace.dependencies]
# Internal crates
tokens-core = { path = "tokens-core" }

# Parallelism
rayon = "1.10"

# JSON parsing (with SIMD acceleration)
simd-json = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# File system traversal
walkdir = "2"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }
# Pinned IANA timezones for stable date bucketing (travel-proof submit).
# A fixed offset cannot follow DST, so the tz database is the price of an
# exact local midnight. `std` alone is enough for `FromStr` + `TimeZone`.
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
# System IANA timezone detection (bootstraps the pinned bucketing timezone)
iana-time-zone = "0.1"

# Error handling
thiserror = "2"
anyhow = "1.0"
libc = "0.2"

# HTTP client (async)
# rustls with the OS trust store is the workspace default. tokens-core also
# enables native TLS on non-Android targets for upstream compatibility.
reqwest = { version = "0.12", features = ["json", "rustls-tls-native-roots"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }

# For disk caching (XDG paths)
dirs = "5"

# SQLite database support (bundled for cross-compilation)
rusqlite = { version = "0.32", features = ["bundled"] }
zstd = "0.13"

# Lazy static initialization
once_cell = "1"

# CLI framework
clap = { version = "4.5", features = ["derive", "cargo"] }

# Tracing/logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
fs2 = "0.4"

[profile.release]
# Configure release optimization for the bundled Tokenory engine.
lto = "thin"
opt-level = 3
codegen-units = 16
strip = true
