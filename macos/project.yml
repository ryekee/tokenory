name: Tokenory
options:
  bundleIdPrefix: ee.ryek
  developmentLanguage: en
  knownRegions: [en, zh-Hans]
  deploymentTarget:
    macOS: '15.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    ARCHS: $(NATIVE_ARCH_ACTUAL)
    MACOSX_DEPLOYMENT_TARGET: '15.0'
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGN_STYLE: Manual
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: NO
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '2'
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    SWIFT_EMIT_LOC_STRINGS: NO
targets:
  Tokenory:
    type: application
    platform: macOS
    sources:
      - path: Tokenory
    info:
      path: Tokenory/Info.plist
      properties:
        CFBundleDisplayName: Tokenory
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ee.ryek.tokenory
        PRODUCT_NAME: Tokenory
    postCompileScripts:
      - name: Embed usage engine
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          PROFILE=debug
          if [ "$CONFIGURATION" = Release ]; then PROFILE=release; fi
          mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          cp "$SRCROOT/../cli/target/$PROFILE/tokenory" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/tokenory"
          /usr/bin/codesign --force --sign - "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/tokenory"
  TokenoryTests:
    type: bundle.unit-test
    platform: macOS
    sources: [TokenoryTests]
    dependencies:
      - target: Tokenory
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Tokenory:
    build:
      targets:
        Tokenory: all

    test:
      targets: [TokenoryTests]
      environmentVariables:
        TOKENORY_TESTING: "1"
