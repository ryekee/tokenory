const $=id=>document.getElementById(id);let metric='tokens',values={tokens:128648,cost:1864},motion=null,frame=0,audio=null,master=null,clickBuffer=null,lastClick=0,sound=false,volume=35,previewTimers=[];
try{const saved=JSON.parse(localStorage.getItem('tokenory-hud-audio')||'null');if(saved){sound=!!saved.sound;volume=Math.max(0,Math.min(100,Number(saved.volume)||0));}}catch{}
function save(){try{localStorage.setItem('tokenory-hud-audio',JSON.stringify({sound,volume}));}catch{}}
function soundUI(){$('sound').setAttribute('aria-checked',sound);$('soundLabel').textContent=sound?'开启':'关闭';$('soundIcon').style.opacity=sound?'1':'.45';$('soundIcon').setAttribute('aria-label',sound?'关闭音效':'开启音效');$('volume').value=volume;$('volumeValue').value=volume+'%';if(master&&audio)master.gain.setValueAtTime(sound?volume/100:0,audio.currentTime);save();}
async function unlock(){try{if(!audio){audio=new AudioContext();master=audio.createGain();master.connect(audio.destination);const len=Math.round(audio.sampleRate*.035);clickBuffer=audio.createBuffer(1,len,audio.sampleRate);const d=clickBuffer.getChannelData(0);for(let i=0;i<len;i++){const t=i/audio.sampleRate;d[i]=.48*(Math.random()*2-1)*Math.exp(-t*270)+.3*Math.sin(t*2*Math.PI*1250)*Math.exp(-t*190)+.2*Math.sin(t*2*Math.PI*360)*Math.exp(-t*130);}}await audio.resume();soundUI();$('audioHint').textContent='开启后，声音随数字滚轮同步加减速。';}catch{$('audioHint').textContent='浏览器未能启用音频，请重新点击试听。';}}
function tick(){if(!sound||!audio||audio.state!=='running')return;const now=audio.currentTime;if(now-lastClick<.027)return;lastClick=now;const source=audio.createBufferSource();source.buffer=clickBuffer;source.connect(master);source.onended=()=>source.disconnect();source.start();}
function stop(){cancelAnimationFrame(frame);motion=null;$('slow').disabled=$('fast').disabled=false;previewTimers.forEach(clearTimeout);previewTimers=[];draw();$('status').textContent='已停稳 · '+formatted();}
function formatted(){return metric==='tokens'?values.tokens.toLocaleString('en-US')+' tokens':'$'+(values.cost/100).toFixed(2);}
let drums=[];
function draw(){const n=values[metric],count=metric==='tokens'?Math.max(6,String(n).length):Math.max(6,String(n).length);$('readout').classList.toggle('cost',metric==='cost');$('readout').replaceChildren();drums=[];if(metric==='cost'){const s=document.createElement('span');s.className='currency';s.textContent='$';$('readout').append(s);}for(let i=count-1;i>=0;i--){const d=document.createElement('div');d.className='drum';const strip=document.createElement('div');strip.className='strip';d.append(strip);$('readout').append(d);drums.push({strip,power:10**i});if((metric==='tokens'&&i>0&&i%3===0)||(metric==='cost'&&i===2)){const p=document.createElement('span');p.className='punct';p.textContent=metric==='cost'?'.':',';$('readout').append(p);}}drums.forEach(d=>position(d,Math.floor(n/d.power)%10));$('readout').setAttribute('aria-label','今日累计 '+formatted());}

// Integrate a short acceleration, brief cruise, and long braking phase.
// Position and velocity share the same clock, including the sound triggers.
function rollCurve(t) {
  const acceleration = .16, cruiseEnd = .34, brake = 1 - cruiseEnd;
  const area = acceleration / 2 + cruiseEnd - acceleration + brake / 3;
  if (t < acceleration) return { progress: t * t / (2 * acceleration * area), speed: t / (acceleration * area) };
  if (t < cruiseEnd) return { progress: (acceleration / 2 + t - acceleration) / area, speed: 1 / area };
  const remaining = (1 - t) / brake;
  return { progress: 1 - brake * remaining ** 3 / (3 * area), speed: remaining ** 2 / area };
}
function brakeToTarget() {
  previewTimers.forEach(clearTimeout); previewTimers = [];
  if (!motion || motion.braking) return;
  const remaining = 1 - motion.progress;
  if (remaining < .0001) return;
  const duration = Math.min(1800, Math.max(700, 3 * remaining / Math.max(motion.speed, .000001)));
  motion.braking = { start: performance.now(), from: motion.progress, duration, slope: Math.min(3, motion.speed * duration / remaining) };
  $('status').textContent = '减速中 · 滚轮正在落位';
}
function animate(kind) {

  if (motion) return;

  values[metric] += delta;

  const duration = kind === 'slow' ? 4300 : 4200;
  motion = { start: performance.now(), duration, progress: 0, speed: 0, braking: null };
  let lastPhase = 0;
  const paths = drums.map(d => {
    const start = Math.floor(from / d.power), diff = Math.floor(values[metric] / d.power) - start;
    return { ...d, start: start % 10, travel: diff > 30 ? 20 + diff % 10 : diff };
  });
  const maxTravel = Math.max(...paths.map(p => p.travel));
  $('slow').disabled = $('fast').disabled = true;
  $('status').textContent = '滚轮加速中';
  function update(now) {
    if (!motion) return;
    let progress, speed, finished;
    if (motion.braking) {
      const b = motion.braking, t = Math.min(1, (now - b.start) / b.duration), r = 1 - b.from;
      // Hermite braking preserves the current velocity and reaches zero velocity at the target.
      progress = b.from + r * ((b.slope - 2) * t ** 3 + (3 - 2 * b.slope) * t ** 2 + b.slope * t);
      speed = r * (3 * (b.slope - 2) * t * t + 2 * (3 - 2 * b.slope) * t + b.slope) / b.duration;
      finished = t >= 1;
    } else {
      const t = Math.min(1, (now - motion.start) / duration), curve = rollCurve(t);
      progress = curve.progress; speed = curve.speed / duration; finished = t >= 1;
      const label = t < .16 ? '滚轮加速中' : t < .34 ? '滚动中' : '逐渐减速 · 齿轮落位';
      if ($('status').textContent !== label) $('status').textContent = label;
    }
    motion.progress = progress; motion.speed = speed;
    paths.forEach(p => position(p, p.start + p.travel * progress));

      paths.forEach(p => position(p, p.start + p.travel));

      $('slow').disabled = $('fast').disabled = false;
      $('status').textContent = '已停稳 · ' + formatted();
    }
  }
  frame = requestAnimationFrame(update);
}
