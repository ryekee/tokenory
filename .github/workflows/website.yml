name: Tokenory website

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to Cloudflare after building
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tokenory-website
  cancel-in-progress: false

jobs:
  website:
    if: (github.event_name == 'release' && !github.event.release.prerelease) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Build from published releases
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_TAG: ${{ github.event.release.tag_name }}
        run: |
          # The published event can arrive before the Releases API lists the tag.
          for delay in 0 5 10 20; do
            sleep "$delay"
            if python3 site/build.py --refresh-releases --expect-tag "$PUBLISHED_TAG"; then
              exit 0
            fi
          done
          exit 1
      - name: Deploy static site
        if: github.event_name == 'release' || inputs.deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the CLOUDFLARE_ACCOUNT_ID repository secret}"
          : "${CLOUDFLARE_API_TOKEN:?Set the CLOUDFLARE_API_TOKEN repository secret}"
          version_tag="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          npx --yes wrangler@4.158.0 versions upload --tag "$version_tag"
          npx --yes wrangler@4.158.0 versions deploy --version-tag "$version_tag" --yes
