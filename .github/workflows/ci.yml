name: CI

# The Changes job keeps the workflow available as a required check even when
# a change does not need macOS validation.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.filter.outputs.cli }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -uo pipefail
          if [ -z "$BASE_SHA" ] || ! changed=$(git diff --name-only "$BASE_SHA" HEAD --); then
            echo "Could not determine changed paths; running macOS checks." >&2
            echo "cli=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if printf '%s\n' "$changed" | grep -Eq '^(cli/|rust-toolchain\.toml$|\.github/workflows/ci\.yml$)'; then
            echo "cli=true" >> "$GITHUB_OUTPUT"
          else
            echo "cli=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: macOS
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            cli/target/
          key: ci-macos-latest-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: ci-macos-latest-

      - name: Clippy
        run: cargo clippy --locked --manifest-path cli/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Build bundled engine
        run: cargo build --locked --release --manifest-path cli/Cargo.toml -p tokenory

      - name: Smoke test
        run: cli/target/release/tokenory --version

      - name: Test
        run: cargo test --locked --manifest-path cli/Cargo.toml --workspace
